name: CI Pipeline - Tests API

on:
  push:
    branches:
      - 'feat/**'
      - 'refact/**'
      - 'test/**'
      - 'main'

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, json, mbstring, pdo_mysql
          tools: composer
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Execute Tests
        run: ./vendor/bin/pest
